name: crew_app
description: EMR-MR crew app for ambulance drivers and paramedics.
publish_to: none
version: 1.0.0+1
resolution: workspace

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  emr_core:
    path: ../../packages/emr_core
  get: ^4.7.3
  dio: ^5.11.1
  uuid: ^4.6.0
  geolocator: ^14.1.1
  url_launcher: ^6.3.3
  lucide_icons_flutter: ^3.1.25
  mobile_scanner: ^7.4.2
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  crypto: ^3.0.7
  path_provider: ^2.1.5
  stomp_dart_client: ^3.0.1
  timeago: ^3.7.1
  permission_handler: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  fake_async: any

flutter:
  uses-material-design: true
